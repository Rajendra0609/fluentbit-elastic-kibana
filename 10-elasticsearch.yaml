# Elasticsearch 8.x, single node, security enabled.
#
# Lab trade-offs (see README "Production differences"):
#   - single-node discovery, so no cluster formation and replicas = 0
#   - HTTP TLS off inside the cluster; authentication is still on
#   - one PersistentVolume for data
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-headless
  namespace: logging
  labels:
    app.kubernetes.io/name: elasticsearch
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200
    - name: transport
      port: 9300
      targetPort: 9300
---
# Stable DNS name used by Kibana, Fluent Bit and the setup Job:
#   elasticsearch.logging.svc.cluster.local:9200
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: logging
  labels:
    app.kubernetes.io/name: elasticsearch
spec:
  selector:
    app.kubernetes.io/name: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: logging
  labels:
    app.kubernetes.io/name: elasticsearch
spec:
  serviceName: elasticsearch-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 0
        runAsNonRoot: true
        fsGroup: 1000
      initContainers:
        # Elasticsearch requires vm.max_map_count >= 262144 on the host kernel.
        # Setting it here applies to the node, not just this container.
        - name: sysctl
          image: busybox:1.36
          command: ["sh", "-c", "sysctl -w vm.max_map_count=262144"]
          securityContext:
            privileged: true
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
          ports:
            - name: http
              containerPort: 9200
            - name: transport
              containerPort: 9300
          env:
            - name: cluster.name
              value: home-lab
            - name: node.name
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: discovery.type
              value: single-node
            - name: ES_JAVA_OPTS
              value: "-Xms1g -Xmx1g"          # JVM heap: about half of the memory limit
            - name: xpack.security.enabled
              value: "true"
            - name: xpack.security.http.ssl.enabled
              value: "false"                  # lab only; enable in production
            - name: xpack.security.transport.ssl.enabled
              value: "false"                  # not needed for a single node
            - name: ELASTIC_PASSWORD          # bootstrap password for the "elastic" superuser
              valueFrom:
                secretKeyRef:
                  name: logging-credentials
                  key: ELASTIC_PASSWORD
          resources:
            requests:
              cpu: 500m
              memory: 1536Mi
            limits:
              cpu: "2"
              memory: 2Gi
          # Use TCP probes. HTTP probes get 401 Unauthorized once security is on,
          # and the kubelet treats that as a failure.
          readinessProbe:
            tcpSocket:
              port: 9200
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9200
            initialDelaySeconds: 120
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # No storageClassName, so the cluster default is used. On k3s this is local-path.
        resources:
          requests:
            storage: 10Gi
