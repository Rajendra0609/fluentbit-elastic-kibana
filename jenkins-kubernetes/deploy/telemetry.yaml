apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-k8s-telemetry-config
  namespace: logging
data:
  ELASTICSEARCH_HOSTS: "http://elasticsearch.logging.svc.cluster.local:9200"
  JENKINS_PROMETHEUS_URL: "http://jenkins.jenkins.svc.cluster.local:8080/prometheus/"
  metricbeat.yml: |
    metricbeat.config.modules:
      path: ${path.config}/modules.d/*.yml
      reload.enabled: false

    setup.template.name: metricbeat
    setup.template.pattern: metricbeat-*

    output.elasticsearch:
      hosts: ["${ELASTICSEARCH_HOSTS}"]
      username: "${ELASTICSEARCH_USERNAME}"
      password: "${ELASTICSEARCH_PASSWORD}"

  node-modules.yml: |
    - module: kubernetes
      metricsets: [node, system, pod, container, volume]
      period: 10s
      host: ${NODE_NAME}
      hosts: ["https://${NODE_IP}:10250"]
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      ssl.verification_mode: none
      add_metadata: true

  cluster-modules.yml: |
    - module: kubernetes
      metricsets:
        - state_namespace
        - state_node
        - state_deployment
        - state_daemonset
        - state_replicaset
        - state_statefulset
        - state_pod
        - state_container
        - state_job
        - state_cronjob
        - state_resourcequota
        - state_service
        - state_persistentvolume
        - state_persistentvolumeclaim
        - state_storageclass
        - state_horizontalpodautoscaler
      hosts: ["kube-state-metrics.kube-system.svc.cluster.local:8080"]
      period: 15s
      add_metadata: true
      use_kubeadm: false

    - module: kubernetes
      metricsets: [event]
      period: 15s
      use_kubeadm: false

    - module: prometheus
      metricsets: [collector]
      hosts: ["${JENKINS_PROMETHEUS_URL}"]
      period: 15s

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-k8s-telemetry
  namespace: logging

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jenkins-k8s-telemetry
rules:
  - apiGroups: [""]
    resources:
      - events
      - namespaces
      - nodes
      - pods
      - services
      - persistentvolumes
      - persistentvolumeclaims
      - resourcequotas
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes/stats, nodes/metrics]
    verbs: [get]
  - apiGroups: [apps]
    resources: [daemonsets, deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jenkins-k8s-telemetry
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: jenkins-k8s-telemetry
subjects:
  - kind: ServiceAccount
    name: jenkins-k8s-telemetry
    namespace: logging

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: kube-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jenkins-k8s-kube-state-metrics
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - endpoints
      - limitranges
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - replicationcontrollers
      - resourcequotas
      - services
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [daemonsets, deployments, replicasets, statefulsets]
    verbs: [list, watch]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [list, watch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jenkins-k8s-kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: jenkins-k8s-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: kube-system

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.15.0
          args:
            - --port=8080
            - --resources=configmaps,cronjobs,daemonsets,deployments,endpoints,horizontalpodautoscalers,jobs,limitranges,namespaces,nodes,persistentvolumeclaims,persistentvolumes,pods,replicasets,replicationcontrollers,resourcequotas,services,statefulsets,storageclasses
          ports:
            - name: http-metrics
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http-metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-metrics
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: [ALL]

---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-state-metrics
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kube-state-metrics
  ports:
    - name: http-metrics
      port: 8080
      targetPort: http-metrics

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: jenkins-k8s-node-metricbeat
  namespace: logging
  labels:
    app.kubernetes.io/name: jenkins-k8s-node-metricbeat
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: jenkins-k8s-node-metricbeat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jenkins-k8s-node-metricbeat
    spec:
      serviceAccountName: jenkins-k8s-telemetry
      terminationGracePeriodSeconds: 30
      containers:
        - name: metricbeat
          image: docker.elastic.co/beats/metricbeat:9.5.5
          args: ["-e", "--strict.perms=false", "-system.hostfs=/hostfs"]
          securityContext:
            runAsUser: 0
            privileged: false
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: ELASTICSEARCH_HOSTS
              valueFrom:
                configMapKeyRef:
                  name: jenkins-k8s-telemetry-config
                  key: ELASTICSEARCH_HOSTS
            - name: ELASTICSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: jenkins-k8s-telemetry
                  key: ELASTICSEARCH_USERNAME
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jenkins-k8s-telemetry
                  key: ELASTICSEARCH_PASSWORD
          volumeMounts:
            - name: metricbeat-config
              mountPath: /usr/share/metricbeat/metricbeat.yml
              subPath: metricbeat.yml
              readOnly: true
            - name: metricbeat-modules
              mountPath: /usr/share/metricbeat/modules.d
              readOnly: true
            - name: proc
              mountPath: /hostfs/proc
              readOnly: true
            - name: sys
              mountPath: /hostfs/sys
              readOnly: true
            - name: root
              mountPath: /hostfs
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              cpu: 1
              memory: 1Gi
      volumes:
        - name: metricbeat-config
          configMap:
            name: jenkins-k8s-telemetry-config
            items:
              - key: metricbeat.yml
                path: metricbeat.yml
        - name: metricbeat-modules
          configMap:
            name: jenkins-k8s-telemetry-config
            items:
              - key: node-modules.yml
                path: kubernetes.yml
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: root
          hostPath:
            path: /

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins-k8s-cluster-metricbeat
  namespace: logging
  labels:
    app.kubernetes.io/name: jenkins-k8s-cluster-metricbeat
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jenkins-k8s-cluster-metricbeat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jenkins-k8s-cluster-metricbeat
    spec:
      serviceAccountName: jenkins-k8s-telemetry
      containers:
        - name: metricbeat
          image: docker.elastic.co/beats/metricbeat:9.5.5
          args: ["-e", "--strict.perms=false"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: ELASTICSEARCH_HOSTS
              valueFrom:
                configMapKeyRef:
                  name: jenkins-k8s-telemetry-config
                  key: ELASTICSEARCH_HOSTS
            - name: JENKINS_PROMETHEUS_URL
              valueFrom:
                configMapKeyRef:
                  name: jenkins-k8s-telemetry-config
                  key: JENKINS_PROMETHEUS_URL
            - name: ELASTICSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: jenkins-k8s-telemetry
                  key: ELASTICSEARCH_USERNAME
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jenkins-k8s-telemetry
                  key: ELASTICSEARCH_PASSWORD
          volumeMounts:
            - name: metricbeat-config
              mountPath: /usr/share/metricbeat/metricbeat.yml
              subPath: metricbeat.yml
              readOnly: true
            - name: metricbeat-modules
              mountPath: /usr/share/metricbeat/modules.d
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              cpu: 1
              memory: 1Gi
      volumes:
        - name: metricbeat-config
          configMap:
            name: jenkins-k8s-telemetry-config
            items:
              - key: metricbeat.yml
                path: metricbeat.yml
        - name: metricbeat-modules
          configMap:
            name: jenkins-k8s-telemetry-config
            items:
              - key: cluster-modules.yml
                path: kubernetes.yml

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-otel-collector-config
  namespace: logging
data:
  collector.yml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      basicauth/elastic:
        client_auth:
          username: ${env:ELASTICSEARCH_USERNAME}
          password: ${env:ELASTICSEARCH_PASSWORD}

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 5s
        send_batch_size: 512
      transform/elastic:
        error_mode: ignore
        trace_statements:
          - context: scope
            statements:
              - set(attributes["elastic.mapping.mode"], "otel")

    exporters:
      elasticsearch:
        endpoint: ${env:ELASTICSEARCH_HOSTS}
        auth:
          authenticator: basicauth/elastic
        traces_index: traces-jenkins
        mapping:
          allowed_modes: [otel]

    service:
      extensions: [health_check, basicauth/elastic]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [transform/elastic, batch]
          exporters: [elasticsearch]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins-otel-collector
  namespace: logging
  labels:
    app.kubernetes.io/name: jenkins-otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jenkins-otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jenkins-otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.120.0
          args: ["--config=/etc/otelcol-contrib/collector.yml"]
          env:
            - name: ELASTICSEARCH_HOSTS
              valueFrom:
                configMapKeyRef:
                  name: jenkins-k8s-telemetry-config
                  key: ELASTICSEARCH_HOSTS
            - name: ELASTICSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: jenkins-k8s-telemetry
                  key: ELASTICSEARCH_USERNAME
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jenkins-k8s-telemetry
                  key: ELASTICSEARCH_PASSWORD
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: collector-config
              mountPath: /etc/otelcol-contrib
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: [ALL]
      volumes:
        - name: collector-config
          configMap:
            name: jenkins-otel-collector-config

---
apiVersion: v1
kind: Service
metadata:
  name: jenkins-otel-collector
  namespace: logging
  labels:
    app.kubernetes.io/name: jenkins-otel-collector
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: jenkins-otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
