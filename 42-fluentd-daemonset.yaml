# Fluentd runs as a DaemonSet, so exactly one agent runs on every node and reads that
# node's container logs. This is the standard pattern for node-level collection.
#
# The image is built from ../image (README, step 0). The official Fluentd DaemonSet images
# bundle an Elasticsearch plugin for version 8 only, so this stack uses its own image.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentd
  namespace: logging
  labels:
    app.kubernetes.io/name: fluentd
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluentd
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluentd
      annotations:
        # Kubernetes does not restart pods when a ConfigMap changes. Bump this value when
        # you change 41-fluentd-config.yaml, so the pod template changes and pods roll.
        checksum/config-hash: "fluentd-config-v2"
    spec:
      serviceAccountName: fluentd
      # Collect logs from control-plane nodes too. Single-node labs have only that node.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      # Must run as root to read /var/log/pods, which is root-owned.
      securityContext:
        runAsUser: 0
      containers:
        - name: fluentd
          image: daggu1997/fluentd:v1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-metrics
              containerPort: 24231
          env:
            # Used by kubernetes_metadata to watch only pods on this node. Without it the
            # filter warns and watches every pod in the cluster.
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: FLUENTD_ES_USER
              value: fluentd
            - name: FLUENTD_ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: logging-credentials
                  key: FLUENTD_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              # Fluentd is a Ruby process and needs more memory than Fluent Bit did (512Mi).
              # Raise this if the pod is OOMKilled under heavy log volume.
              memory: 768Mi
          livenessProbe:
            httpGet:
              path: /metrics
              port: 24231
            initialDelaySeconds: 20
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: config
              mountPath: /fluentd/etc/
              readOnly: true
            - name: state
              mountPath: /var/lib/fluentd
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: config
          configMap:
            name: fluentd-config
        # Position file and disk buffer. They live on the host, so a pod restart resumes
        # where it stopped and does not lose buffered logs.
        - name: state
          hostPath:
            path: /var/lib/fluentd
            type: DirectoryOrCreate