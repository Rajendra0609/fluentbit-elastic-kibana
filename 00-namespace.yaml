# Namespace for the logging stack.
# Fluentd mounts host paths (/var/log and /var/lib/fluentd), which the "baseline" and
# "restricted" Pod Security levels forbid, so this namespace uses "privileged". Keep log
# collection isolated in this namespace and do not run application workloads here.
apiVersion: v1
kind: Namespace
metadata:
  name: logging
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
