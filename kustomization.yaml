# Applies the whole logging stack with:  kubectl apply -k .
# Secrets are NOT listed here. Create them first with ./01-create-secrets.sh
# (deploy.sh does both in the right order).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespace.yaml
  - 10-elasticsearch.yaml
  - 20-es-setup-job.yaml
  - 30-kibana.yaml
  - 40-fluentd-rbac.yaml
  - 41-fluentd-config.yaml
  - 42-fluentd-daemonset.yaml
  - 50-log-generator.yaml

# The Fluentd image is built from ./image (see image/build.sh). If you push it to a
# registry, set newName to the registry path, for example registry.example.com/lab/fluentd-logging.
images:
  - name: fluentd-logging
    newName: fluentd-logging
    newTag: "1.19.4"
